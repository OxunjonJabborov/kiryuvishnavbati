{% extends "base.html" %}{% block title %}Ro'yxatdan o'tish{% endblock %}
{% block body %}
<section class="auth">
  <h1>Ro'yxatdan o'tish</h1>
  <form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>F.I.Sh. <input name="full_name" required></label>
    <label>Xona raqami <input name="room" type="number" min="1" max="999" required></label>
    <label>Login <input name="username" required></label>
    <label>Parol (kamida 6 belgi) <input name="password" type="password" minlength="6" required></label>
    <button>Ro'yxatdan o'tish</button>
    <p class="muted small"><a href="{{ url_for('login') }}">Kirish sahifasiga qaytish</a></p>
  </form>
</section>
{% endblock %}
