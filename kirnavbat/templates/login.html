{% extends "base.html" %}{% block title %}Kirish{% endblock %}
{% block body %}
<section class="auth">
  <h1>TTJ kir yuvish navbati</h1>
  <p class="muted">Navbat kutmang — mashinani oldindan band qiling.</p>
  <form method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Login <input name="username" required autofocus></label>
    <label>Parol <input name="password" type="password" required></label>
    <button>Kirish</button>
    <p class="muted small">Hisobingiz yo'qmi? <a href="{{ url_for('register') }}">Ro'yxatdan o'ting</a></p>
  </form>
</section>
{% endblock %}
